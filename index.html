<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b25"><meta name="description" content="ميزانيتي - إدارة الدخل والمصروفات">
<link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ميزانيتي"><title>ميزانيتي</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#142a25;--mut:#718079;--g:#167a58;--r:#d95757;--a:#e9b95e;--line:#e7eeea;--in:#f3f6f4}
@media(prefers-color-scheme:dark){:root{--bg:#0c1815;--card:#152622;--ink:#e6f0ec;--mut:#93a69d;--line:#223832;--in:#0f201c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 0 100px}
button,input,select{font:inherit;color:inherit}a{color:var(--g);font-size:14px;cursor:pointer}small{color:var(--mut)}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px;padding-top:max(16px,env(safe-area-inset-top))}.brand{font-weight:800;font-size:20px}
#month{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
main{padding:0 16px}.hero{background:linear-gradient(145deg,#102b25,#1c5945);color:#fff;border-radius:24px;padding:20px;margin:8px 0 12px}.hero small{color:#c5ddd3}.big{font-size:34px;font-weight:800;margin:4px 0 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.two>div{background:#ffffff18;border-radius:14px;padding:10px}.two b{display:block;margin-top:4px}.up{color:#a5f0c7}.dn{color:#ffb4b4}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}.chip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:110px}.chip b{display:block;font-size:15px}
.note{background:var(--card);border:1px dashed var(--a);border-radius:14px;padding:10px;margin-bottom:12px;font-size:14px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 4px;font-weight:700}
.hd{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px}.hd h2{font-size:17px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;font-size:14px}
.br{margin:6px 0 10px}.trk{height:9px;background:var(--line);border-radius:9px;overflow:hidden}.trk i{display:block;height:100%;background:var(--g);border-radius:9px}.trk i.a{background:var(--a)}.trk i.r{background:var(--r)}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.tx:last-child{border:0}.ti{width:40px;height:40px;border-radius:12px;background:var(--in);display:grid;place-items:center;font-size:19px}.tf{flex:1;min-width:0}.tf b,.tf small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tf small{font-size:12px}
.plus{color:var(--g);font-weight:700}.minus{color:var(--r);font-weight:700}.tr{color:var(--mut);font-weight:700}.empty{text-align:center;color:var(--mut);padding:18px;font-size:14px}
.flt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}.flt input,.flt select,.sheet input,.sheet select{width:100%;background:var(--in);border:1px solid var(--line);border-radius:12px;padding:11px}.flt input:first-child{grid-column:1/3}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.menu button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 8px;font-weight:700;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 0 max(6px,env(safe-area-inset-bottom))}nav button{flex:1;background:none;border:0;color:var(--mut);font-size:12px;padding:6px}nav button span{display:block;font-size:20px}nav .on{color:var(--g);font-weight:700}
.fab{position:fixed;left:18px;bottom:84px;width:56px;height:56px;border-radius:50%;border:0;background:var(--g);color:#fff;font-size:30px;box-shadow:0 6px 18px #0004}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:5}.modal.show{display:flex}.sheet{background:var(--card);width:100%;max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px 28px}.sheet h2{margin:0 0 8px}.sheet h3{margin:16px 0 4px;font-size:15px}.sheet label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mut)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.seg button{border:1px solid var(--line);background:var(--in);border-radius:12px;padding:10px}.seg .on{background:var(--g);color:#fff;border-color:var(--g)}
.pri,.del,.sec{width:100%;border:0;border-radius:14px;padding:14px;margin-top:12px;font-weight:700;background:var(--g);color:#fff}.del{background:var(--r)}.sec{background:var(--in);color:var(--ink);border:1px solid var(--line)}.ck{display:flex!important;gap:8px;align-items:center}.ck input{width:auto}
.fr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}.fr input{width:120px}.ib{background:none;border:0;font-size:18px}

.card{box-shadow:0 1px 4px #0000000d}nav .on span{background:var(--in);border-radius:12px;padding:0 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:9px 15px;font-size:14px}.tabs .on{background:var(--g);color:#fff;border-color:var(--g);font-weight:700}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.mc{border:1px solid var(--line);background:var(--in);border-radius:12px;padding:8px 2px;font-size:12px;line-height:1.4}.mc.p{background:var(--g);color:#fff;border-color:var(--g)}.mc.n{outline:2px solid var(--a)}.mc.t{border-color:var(--a);border-width:2px}.mc.l{border-color:var(--r);color:var(--r)}.item{padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.tag{font-size:11px;background:var(--in);border-radius:8px;padding:2px 7px;margin-inline-start:4px}
#toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:#142a25;color:#fff;padding:11px 18px;border-radius:14px;display:none;z-index:9;font-size:14px;gap:14px;white-space:nowrap}#toast a{color:#a5f0c7;margin-inline-start:12px}
#lock{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;align-items:center;justify-content:center}.lk{text-align:center}.lk input{background:var(--in);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;font-size:22px;width:200px}
</style></head><body>
<div class="top"><div class="brand">✦ ميزانيتي</div><select id="month" onchange="sel=this.value;render()"></select></div>
<main id="app"></main><button class="fab" onclick="txForm()">＋</button>
<nav><button data-v="home" onclick="go('home')"><span>⌂</span>الرئيسية</button><button data-v="tx" onclick="go('tx')"><span>↕</span>الحركات</button><button data-v="plan" onclick="go('plan')"><span>🧾</span>الالتزامات</button><button data-v="stats" onclick="go('stats')"><span>◔</span>التقارير</button><button data-v="more" onclick="go('more')"><span>☰</span>المزيد</button></nav>
<div class="modal" id="sh" onclick="if(event.target===this)closeS()"><div class="sheet" id="shb"></div></div><div id="toast"></div><div id="lock"></div>
<script>
const $=s=>document.querySelector(s),K='mizany_v2',IC=['راتب','عمل حر','هدية','أخرى'],COL=['#167a58','#e9b95e','#d95757','#4f8fd6','#9b6bd3','#e8845a','#3bb3a6','#8a9a5b','#c76b98'];
const DC=[['أكل ومشروبات','🍽️'],['مواصلات','🚗'],['فواتير','💡'],['تسوق','🛍️'],['صحة','💊'],['سكن','🏠'],['ترفيه','🎬'],['تعليم','📚'],['أخرى','🧾']].map(([n,i])=>({n,i}));
const DA=[{id:'cash',n:'كاش'},{id:'bank',n:'بنك'},{id:'wallet',n:'محفظة'}];
function load(){try{const s=JSON.parse(localStorage.getItem(K));if(s)return s}catch(e){}
return{records:JSON.parse(localStorage.getItem('mizany_records')||'[]').map((r,i)=>({...r,id:r.id||'o'+i,acct:'cash'})),budgets:JSON.parse(localStorage.getItem('mizany_budgets')||'{}'),cb:{},cats:DC,accts:DA,debts:[],goals:[],rec:[],cur:'ج.م',pin:''}}
let S=load();S.inst=S.inst||[];S.jam=S.jam||[];S.tpl=S.tpl||[];const save=()=>{RC={};try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('⚠️ المساحة امتلأت — اعمل نسخة احتياطية')}};
const pad=n=>String(n).padStart(2,'0'),mk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1),today=()=>{const d=new Date();return mk(d)+'-'+pad(d.getDate())},uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ar-EG',{maximumFractionDigits:2}),money=n=>fmt(n)+' '+S.cur;
let sel=mk(new Date()),view='home',allM=false;
const inM=r=>{const g=rng(sel);return r.date>=g[0]&&r.date<=g[1]},sum=(l,t)=>l.filter(x=>x.type===t&&!x.x).reduce((a,x)=>a+x.amount,0),ci=n=>(S.cats.find(c=>c.n===n)||{i:'🧾'}).i,an=id=>(S.accts.find(a=>a.id===id)||{n:'—'}).n;
const catSpend=(L,n)=>L.filter(x=>x.type==='expense'&&!x.x&&x.category===n).reduce((a,x)=>a+x.amount,0);
const bal=id=>((S.accts.find(a=>a.id===id)||{}).open||0)+S.records.reduce((a,r)=>a+(r.type==='income'&&r.acct===id?r.amount:r.type==='expense'&&r.acct===id?-r.amount:r.type==='transfer'?(r.acct===id?-r.amount:0)+(r.to===id?r.amount:0):0),0);
const mname=()=>new Date(+sel.slice(0,4),+sel.slice(5)-1,1).toLocaleDateString('ar-EG',{month:'long',year:'numeric'});
function runRec(){const cur=mk(new Date()),t=today();S.rec.forEach(x=>{let[y,m]=x.last.split('-').map(Number);for(;;){m++;if(m>12){m=1;y++}const k=y+'-'+pad(m);if(k>cur)break;const d=k+'-'+pad(Math.min(x.day,28));if(d>t)break;S.records.push({id:uid(),type:x.type,amount:x.amount,category:x.category,title:x.title,acct:x.acct,date:d,created:Date.now(),auto:1});x.last=k}});const t2=today();S.inst.forEach(x=>{let[y,m]=x.last.split('-').map(Number);while(x.paid<x.n){m++;if(m>12){m=1;y++}const k=y+'-'+pad(m);if(k>cur)break;const d=k+'-'+pad(Math.min(x.day,28));if(d>t2)break;S.records.push({id:uid(),type:'expense',amount:x.amt,category:'أقساط',title:x.name+' ('+(x.paid+1)+'/'+x.n+')',acct:x.acct,date:d,created:Date.now(),auto:1});x.paid++;x.last=k}});save()}
function bar(v,max,l){const p=max?v/max*100:0,c=p>100?'r':p>=80?'a':'';return`<div class="br"><div class="row"><span>${l}</span><b>${money(v)} / ${money(max)}</b></div><div class="trk"><i class="${c}" style="width:${Math.min(100,p)}%"></i></div></div>`}
function txHTML(r){const t=r.type==='transfer';return`<div class="tx" onclick="edit('${r.id}')"><div class="ti">${t?'🔁':r.type==='income'?'💰':ci(r.category)}</div><div class="tf"><b>${esc(t?an(r.acct)+' ← '+an(r.to):r.title||r.category)}</b><small>${esc(r.category)}${r.x?' <span class="tag">خارج حساب الشهر</span>':''} • ${an(r.acct)} • ${new Date(r.date+'T12:00:00').toLocaleDateString('ar-EG')}${r.auto?' • 🔁':''}</small></div><div class="${t?'tr':r.type==='income'?'plus':'minus'}">${t?'':r.type==='income'?'+':'−'}${money(r.amount)}</div></div>`}
const list=L=>L.length?[...L].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created).map(txHTML).join(''):'<div class="empty">مفيش حركات هنا ✨</div>';
function home(){const L=S.records.filter(inM),inc=sum(L,'income'),ex=sum(L,'expense'),b=S.budgets[sel]||0,ct=L.filter(x=>x.type==='expense'&&!x.x),noT=cinfo(sel).cur&&!S.records.some(r=>r.date===today());
const cf=cinfo(sel),dim=cf.len,days=cf.el,m={};ct.forEach(x=>m[x.category]=(m[x.category]||0)+x.amount);const top=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];
return`<div class="hero"><small>صافي ${mname()}${rl()?' • '+rl():''}</small><div class="big">${money(inc-ex)}</div><div class="two"><div><small>↙ الإيرادات</small><b class="up">${money(inc)}</b></div><div><small>↗ المصروفات</small><b class="dn">${money(ex)}</b></div></div></div>
<div class="chips">${S.accts.map(a=>`<div class="chip"><small>${esc(a.n)}</small><b>${money(bal(a.id))}</b></div>`).join('')}</div>${noT?'<div class="note">🔔 لسه ماسجلتش حاجة النهارده</div>':''}${jamNote()}
${tplRow()}<div class="quick"><button onclick="txForm({type:'income'})">＋ دخل</button><button onclick="txForm({type:'expense'})">− مصروف</button><button onclick="txForm({type:'transfer'})">⇄ تحويل</button></div>
<div class="hd"><h2>الميزانية</h2><a onclick="budgetSheet()">تعديل</a></div><div class="card">${b?bar(ex,b,'الإجمالي'):'<div class="empty">حدد ميزانية الشهر من "تعديل"</div>'}${S.cats.filter(c=>S.cb[c.n]).map(c=>bar(catSpend(L,c.n),S.cb[c.n],c.i+' '+esc(c.n))).join('')}</div>
${debtsCard()}<div class="hd"><h2>آخر الحركات</h2><a onclick="go('tx')">الكل</a></div><div class="card">${list(L.slice().sort((a,b)=>b.created-a.created).slice(0,5))}</div>
<div class="hd"><h2>ملخص</h2></div><div class="card"><div class="row"><span>عدد العمليات</span><b>${fmt(L.length)}</b></div><div class="row"><span>متوسط المصروف اليومي</span><b>${money(ex/days)}</b></div><div class="row"><span>أكبر بند</span><b>${top?esc(top[0])+' ('+money(top[1])+')':'—'}</b></div></div>`}
function fl(){const q=($('#fq')?.value||'').trim(),t=$('#ft2')?.value||'',c=$('#fc2')?.value||'';const df=$('#fdf')?.value||'',dt=$('#fdt')?.value||'';return S.records.filter(r=>((df||dt)?(!df||r.date>=df)&&(!dt||r.date<=dt):(allM||inM(r)))&&(!t||r.type===t)&&(!c||r.category===c)&&(!q||(r.title||'').includes(q)||r.category.includes(q)||String(r.amount).includes(q)))}
const tl=()=>{const L=fl();$('#tl').innerHTML=list(L);$('#ts').textContent=L.length+' حركة • دخل '+fmt(sum(L,'income'))+' • مصروف '+fmt(sum(L,'expense'))};
function tx(){return`<div class="hd"><h2>الحركات</h2><small id="ts"></small></div><div class="flt"><input id="fq" placeholder="🔍 بحث..." oninput="tl()"><select id="ft2" onchange="tl()"><option value="">كل الأنواع</option><option value="income">دخل</option><option value="expense">مصروف</option><option value="transfer">تحويل</option></select><select id="fc2" onchange="tl()"><option value="">كل الفئات</option>${S.cats.map(c=>`<option>${esc(c.n)}</option>`).join('')}</select><div><small>من تاريخ</small><input id="fdf" type="date" onchange="tl()"></div><div><small>إلى تاريخ</small><input id="fdt" type="date" onchange="tl()"></div></div><label class="ck" style="margin-bottom:8px;font-size:14px"><input type="checkbox" ${allM?'checked':''} onchange="allM=this.checked;tl()"> كل الشهور</label><div class="card" id="tl"></div>`}
function stats(){const L=S.records.filter(inM),tot=sum(L,'expense'),m={};L.filter(x=>x.type==='expense'&&!x.x).forEach(x=>m[x.category]=(m[x.category]||0)+x.amount);const d=Object.entries(m).sort((a,b)=>b[1]-a[1]);let off=0;
const arcs=d.map(([n,v],i)=>{const p=v/tot*100,s=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${COL[i%9]}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${25-off}"/>`;off+=p;return s}).join('');
const ms=[...Array(6)].map((_,i)=>{const dt=new Date(+sel.slice(0,4),+sel.slice(5)-1-(5-i),1),l=ML(mk(dt));return{k:dt.getMonth()+1,i:sum(l,'income'),e:sum(l,'expense')}});const mx=Math.max(1,...ms.flatMap(x=>[x.i,x.e]));
const bars=ms.map((x,i)=>{const a=x.i/mx*90,b=x.e/mx*90;return`<rect x="${i*50+8}" y="${100-a}" width="15" height="${a}" rx="3" fill="#167a58"/><rect x="${i*50+25}" y="${100-b}" width="15" height="${b}" rx="3" fill="#d95757"/><text x="${i*50+24}" y="114" font-size="10" text-anchor="middle" fill="var(--mut)">${fmt(x.k)}</text>`}).join('');
const cf=cinfo(sel),dim=cf.len,isC=cf.cur,el=cf.el,prev=ms[4].e,df=prev?Math.round((tot-prev)/prev*100):null;
return`<div class="hd"><h2>مصروفات ${mname()}</h2></div><div class="card">${tot?`<div style="display:flex;gap:14px;align-items:center"><svg viewBox="0 0 42 42" width="140" style="transform:rotate(0)"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="6"/>${arcs}</svg><div style="flex:1;font-size:13px">${d.slice(0,6).map(([n,v],i)=>`<div class="row"><span><span style="color:${COL[i%9]}">●</span> ${esc(n)}</span><b>${fmt(Math.round(v/tot*100))}٪</b></div>`).join('')}</div></div>`:'<div class="empty">مفيش مصروفات في الشهر ده</div>'}</div>
<div class="hd"><h2>آخر ٦ شهور</h2><small><span style="color:#167a58">●</span> دخل <span style="color:#d95757">●</span> مصروف</small></div><div class="card"><svg viewBox="0 0 300 120" width="100%">${bars}</svg></div>
<div class="hd"><h2>تحليل</h2></div><div class="card"><div class="row"><span>إجمالي المصروف</span><b>${money(tot)}</b></div>${isC?`<div class="row"><span>توقع آخر الشهر</span><b>${money(tot/el*dim)}</b></div>`:''}${df===null?'':`<div class="row"><span>مقارنة بالشهر اللي فات</span><b style="color:var(--${df>0?'r':'g'})">${df>0?'▲':'▼'} ${fmt(Math.abs(df))}٪</b></div>`}</div>`}
function go(v){view=v;render();scrollTo(0,0)}
function render(){$('#month').value=sel;$('#app').innerHTML=({home,tx,plan,stats,more})[view]();$('.fab').style.display=(view==='home'||view==='tx')?'':'none';if(view==='tx')tl();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view))}
function sheet(t,h){$('#shb').innerHTML=`<h2>${t}</h2>${h}<button class="sec" onclick="closeS()">إغلاق</button>`;$('#sh').classList.add('show')}
const closeS=()=>{window.pimg=null;$('#sh').classList.remove('show')};
let uf=null;function toast(m,f){uf=f;const t=$('#toast');t.innerHTML=esc(m)+(f?'<a onclick="uf();$(\'#toast\').style.display=\'none\'">تراجع</a>':'');t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',f?5000:2500)}
const opt=(v,s)=>`<option ${v==s?'selected':''}>${esc(v)}</option>`,aopt=s=>S.accts.map(a=>`<option value="${a.id}" ${a.id===s?'selected':''}>${esc(a.n)}</option>`).join('');
const rd=()=>({amount:+$('#fa').value||'',category:$('#fc')?.value,acct:$('#fx').value,title:$('#ft').value,date:$('#fd').value});
function txForm(e){e=e||{};const t=e.type||'expense',T=t==='transfer';
sheet(e.id?'تعديل حركة':'حركة جديدة',`<div class="seg">${[['expense','مصروف'],['income','دخل'],['transfer','تحويل']].map(([k,l])=>`<button class="${t===k?'on':''}" onclick="txForm({...rd(),type:'${k}',id:'${e.id||''}',to:'${e.to||''}'})">${l}</button>`).join('')}</div>${e.id?'':tplChips()}${t==='expense'&&!e.id?favChips():''}
<label>المبلغ</label><input id="fa" type="number" inputmode="decimal" value="${e.amount||''}">${T?'':`<label>الفئة</label><select id="fc">${cl(t,e).map(c=>opt(c,e.category)).join('')}</select>`}
<label>${T?'من حساب':'الحساب'}</label><select id="fx">${aopt(e.acct)}</select>${T?`<label>إلى حساب</label><select id="fy">${aopt(e.to)}</select>`:''}

function jamForm(){sheet('جمعية جديدة',`<label>الاسم</label><input id="j1"><label>القسط الشهري</label><input id="j2" type="number" inputmode="decimal"><label>عدد الشهور (الأعضاء)</label><input id="j3" type="number"><label>دورك في الشهر رقم</label><input id="j4" type="number"><label>شهر بداية الجمعية</label><input id="j5" type="month" value="${mk(new Date())}"><label>الحساب</label><select id="j6">${aopt()}</select><label class="ck"><input type="checkbox" id="j7" checked> دفعت كل الشهور اللي فاتت (من غير ما تتسجل مصروفات)</label><label class="ck"><input type="checkbox" id="j8"> استلمت دوري بالفعل</label><button class="pri" onclick="addJam()">إضافة</button>`)}
function addJam(){const n=$('#j1').value.trim(),a=+$('#j2').value,c=+$('#j3').value,t=+$('#j4').value,st=$('#j5').value;if(!n||!(a>0)||!(c>1)||!(t>=1&&t<=c)||!st)return toast('راجع البيانات');const x={id:uid(),name:n,amt:a,n:c,turn:t,start:st,acct:$('#j6').value,pays:{},gotK:''};if($('#j7').checked)for(let q=0;q<Math.min(jc(x)-1,c);q++)x.pays[pm(st,-q)]=1;if($('#j8').checked)x.gotK=pm(st,-(t-1));S.jam.push(x);save();closeS();render();toast('تمت إضافة الجمعية ✓')}
function jamTap(i,j){const x=S.jam[i],k=pm(x.start,-(j-1));if(x.pays[k]){delete x.pays[k];S.records=S.records.filter(r=>!(r.jam===x.id&&r.jk===k));toast('اتشال التعليم')}else{x.pays[k]=1;if(k>=mk(new Date())&&confirm('تسجّل الدفع كحركة على حساب '+an(x.acct)+'؟\n(مش هيتحسب من مصروفات الشهر)'))S.records.push({id:uid(),type:'expense',x:1,amount:x.amt,category:'جمعية',title:'قسط جمعية '+x.name,acct:x.acct,date:today(),created:Date.now(),jam:x.id,jk:k});toast('اتعلّم مدفوع ✓')}save();render()}
function jamGet(i){const x=S.jam[i];if(x.gotK){x.gotK='';S.records=S.records.filter(r=>!(r.jam===x.id&&r.jk==='get'));toast('اتشال الاستلام')}else{x.gotK=pm(x.start,-(x.turn-1));if(confirm('تسجّل استلام '+money(x.amt*x.n)+' كحركة على حساب '+an(x.acct)+'؟\n(لو استلمتها قبل كده وسجلتها اختار إلغاء)'))S.records.push({id:uid(),type:'income',x:1,amount:x.amt*x.n,category:'جمعية',title:'استلام جمعية '+x.name,acct:x.acct,date:today(),created:Date.now(),jam:x.id,jk:'get'});toast('تم ✓')}save();render()}
function instPage(){return addBtn('instForm()','قسط جديد')+`<div class="card">${S.inst.map((x,i)=>{const l=x.n-x.paid;return`<div class="item"><div class="row"><b>📅 ${esc(x.name)}</b><b>${money(x.amt)}</b></div><div class="trk"><i style="width:${x.paid/x.n*100}%"></i></div><small>${fmt(x.paid)} من ${fmt(x.n)} • متبقي ${money(l*x.amt)} • يوم ${fmt(x.day)} كل شهر${l?' • آخر قسط '+mlab(pm(x.last,-l)):' • ✅ خلص'}</small><br><a onclick="if(confirm('حذف القسط؟')){S.inst.splice(${i},1);save();render()}">🗑 حذف</a></div>`}).join('')||'<div class="empty">مفيش أقساط</div>'}</div>`}
function instForm(){sheet('قسط جديد',`<label>الاسم</label><input id="i1" placeholder="مثلاً: موبايل"><label>قيمة القسط الشهري</label><input id="i2" type="number" inputmode="decimal"><label>عدد الأقساط الكلي</label><input id="i3" type="number"><label>اتدفع قبل كده كام قسط؟</label><input id="i4" type="number" value="0"><label>يوم الدفع من الشهر</label><input id="i5" type="number" min="1" max="28" value="1"><label>الحساب</label><select id="i6">${aopt()}</select><label class="ck"><input type="checkbox" id="i7"> قسط الشهر ده اتدفع خلاص (متسجلوش تاني)</label><button class="pri" onclick="addInst()">إضافة</button>`)}
function addInst(){const n=$('#i1').value.trim(),a=+$('#i2').value,c=+$('#i3').value,now=$('#i7').checked;let p=(+$('#i4').value||0)+(now?1:0);if(!n||!(a>0)||!(c>0)||p>c)return toast('راجع البيانات');S.inst.push({id:uid(),name:n,amt:a,n:c,paid:p,day:Math.min(28,Math.max(1,+$('#i5').value||1)),acct:$('#i6').value,last:now?mk(new Date()):pm(mk(new Date()),1)});runRec();closeS();render();toast('تمت إضافة القسط ✓')}
function goalsPage(){return addBtn('goalForm()','هدف جديد')+`<div class="card">${S.goals.map((g,i)=>`<div class="item"><div class="row"><b>🎯 ${esc(g.n)}</b><b>${fmt(Math.round(g.saved/g.target*100))}٪</b></div><div class="trk"><i style="width:${Math.min(100,g.saved/g.target*100)}%"></i></div><small>${money(g.saved)} من ${money(g.target)} • متبقي ${money(Math.max(0,g.target-g.saved))}</small><div class="two" style="margin-top:6px"><button class="sec" style="margin:0" onclick="const v=+prompt('المبلغ اللي هتضيفه؟');if(v>0){S.goals[${i}].saved+=v;save();render()}">＋ إضافة مبلغ</button><button class="sec" style="margin:0" onclick="if(confirm('حذف الهدف؟')){S.goals.splice(${i},1);save();render()}">🗑 حذف</button></div></div>`).join('')||'<div class="empty">مفيش أهداف لسه</div>'}</div>`}
const goalForm=()=>sheet('هدف جديد',`<label>اسم الهدف</label><input id="gn"><label>المبلغ المستهدف</label><input id="gt" type="number" inputmode="decimal"><label>المدخر لحد دلوقتي</label><input id="gs" type="number" value="0"><button class="pri" onclick="const n=$('#gn').value.trim(),t=+$('#gt').value;if(n&&t>0){S.goals.push({n,target:t,saved:+$('#gs').value||0});save();closeS();render()}else toast('راجع البيانات')">إضافة</button>`);
const recPage=()=>addBtn('txForm()','حركة (واختار: يتكرر كل شهر)')+`<div class="card">${S.rec.map((x,i)=>`<div class="item"><div class="row"><b>${x.type==='income'?'💰':ci(x.category)} ${esc(x.title||x.category)}</b><b>${money(x.amount)}</b></div><small>${an(x.acct)} • يوم ${fmt(x.day)} من كل شهر</small><br><a onclick="if(confirm('إيقاف التكرار؟')){S.rec.splice(${i},1);save();render()}">🗑 إيقاف</a></div>`).join('')||'<div class="empty">مفيش حركات متكررة</div>'}</div>`;
const more=()=>`<div class="menu">${[['◉ الميزانية','budgetSheet()'],['🏷️ الفئات','catsSheet()'],['🏦 الحسابات والأرصدة','acctsSheet()'],['📈 التقرير السنوي','yearSheet()'],['📤 مشاركة تقرير الشهر','shareRep()'],['⚙️ الإعدادات والنسخ','setSheet()']].map(([l,f])=>`<button onclick="${f}">${l}</button>`).join('')}</div><div class="empty">بياناتك محفوظة على جهازك • ميزانيتي 2.4</div>`;
function acctsSheet(){sheet('الحسابات',S.accts.map((a,i)=>`<div class="fr"><span>${esc(a.n)}<br><small>${money(bal(a.id))}</small></span><span><button class="ib" onclick="adj(${i})">⚖️</button><button class="ib" onclick="delAcct(${i})">🗑</button></span></div>`).join('')+`<small>⚖️ تسوية: اكتب الرصيد الحقيقي فيتظبط الرصيد الافتتاحي</small><h3>حساب جديد</h3><input id="an" placeholder="الاسم"><label>الرصيد الحالي</label><input id="ao" type="number" value="0"><button class="pri" onclick="const n=$('#an').value.trim();if(n){S.accts.push({id:uid(),n,open:+$('#ao').value||0});save();acctsSheet();render()}">إضافة</button>`)}
function adj(i){const a=S.accts[i],v=prompt('الرصيد الحقيقي في "'+a.n+'" دلوقتي؟');if(v===null||v===''||isNaN(v))return;a.open=(a.open||0)+(+v-bal(a.id));save();acctsSheet();render()}
function delAcct(i){const id=S.accts[i].id;if(S.accts.length<2||S.records.some(r=>r.acct===id||r.to===id)||S.inst.some(x=>x.acct===id)||S.jam.some(x=>x.acct===id)||S.rec.some(x=>x.acct===id))return toast('مينفعش حذف حساب مستخدم');S.accts.splice(i,1);save();acctsSheet();render()}
let RC={};const ymd=t=>t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()),dAdd=(d,n)=>{const t=new Date(d+'T12:00:00');t.setDate(t.getDate()+n);return ymd(t)},mAdd=(d,n)=>{const t=new Date(d+'T12:00:00');t.setMonth(t.getMonth()+n);return ymd(t)},lastDay=K=>ymd(new Date(+K.slice(0,4),+K.slice(5),0));
function mkrs(){const o={};let last='';(S.cyc===0?[]:S.records.filter(r=>r.type==='income'&&r.category==='راتب'&&!r.x).map(r=>r.date).sort()).forEach(d=>{if(last&&(new Date(d)-new Date(last))/864e5<15)return;last=d;const K=+d.slice(8)>=20?pm(d.slice(0,7),-1):d.slice(0,7);if(!o[K])o[K]=d});return o}
function rng(K){if(RC[K])return RC[K];const M=RC.m||(RC.m=mkrs()),f=Object.keys(M).sort()[0],after=f&&K>f,s=M[K]||(after?dAdd(rng(pm(K,1))[1],1):K+'-01'),nx=M[pm(K,-1)],e=nx?dAdd(nx,-1):(M[K]||after?dAdd(mAdd(s,1),-1):lastDay(K));return RC[K]=[s,e]}
const keyOf=d=>[mk(new Date(d+'T12:00:00'))].flatMap(k=>[k,pm(k,-1),pm(k,1)]).find(k=>{const g=rng(k);return d>=g[0]&&d<=g[1]})||d.slice(0,7);
function cinfo(K){const g=rng(K),t=today(),len=Math.round((new Date(g[1])-new Date(g[0]))/864e5)+1;return{len,cur:t>=g[0]&&t<=g[1],el:t<g[0]?1:Math.max(1,Math.min(len,Math.round((new Date(t)-new Date(g[0]))/864e5)+1))}}
const rl=()=>{const g=rng(sel);if(g[0]===sel+'-01'&&g[1]===lastDay(sel))return'';const f=d=>new Date(d+'T12:00:00').toLocaleDateString('ar-EG',{day:'numeric',month:'short'});return f(g[0])+' ← '+f(g[1])};
(function init(){const m=$('#month');for(let i=-1;i<18;i++){const d=new Date(new Date().getFullYear(),new Date().getMonth()-i,1),o=document.createElement('option');o.value=mk(d);o.textContent=d.toLocaleDateString('ar-EG',{month:'long',year:'numeric'});m.append(o)}
fixData();runRec();sel=keyOf(today());render();if(S.pin)lock();navigator.storage?.persist?.();const a=new URLSearchParams(location.search).get('add');if(a)txForm({type:a});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))})();
</script></body></html>
